[project]
name = "qa-autopilot-engine"
version = "0.1.0"
description = "AI-powered frontend QA automation engine"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "playwright",
    "anthropic",
    "pydantic>=2.0",
    "httpx",
    "sse-starlette",
    "python-dotenv",
    "loguru",
    "sentry-sdk[fastapi]",
]

[project.scripts]
engine = "engine.main:run"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
